<!doctype html>
<html><head><meta charset="utf-8"><title>Dark theme brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#000000; font-family:var(--enph-font-primary); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; }
  .sw { aspect-ratio: 1.1/1; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; }
  .sw .name { font-size: 11px; font-family: var(--enph-font-technical); text-transform: uppercase; letter-spacing: 0.15em; color:#3C3C3C; }
  .sw .hex { font-size: 11px; color:#3C3C3C; opacity: 0.85; margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#FF8B49"><div class="name">Orange 01</div><div class="hex">#FF8B49</div></div>
    <div class="sw" style="background:#FFB6B6"><div class="name">Pink</div><div class="hex">#FFB6B6</div></div>
    <div class="sw" style="background:#61C06A"><div class="name">Green 01</div><div class="hex">#61C06A</div></div>
    <div class="sw" style="background:#FFD02C"><div class="name">Yellow</div><div class="hex">#FFD02C</div></div>
    <div class="sw" style="background:#C8DEFF"><div class="name">Light Blue</div><div class="hex">#C8DEFF</div></div>
    <div class="sw" style="background:#5BBBC1"><div class="name">Teal 01</div><div class="hex">#5BBBC1</div></div>
    <div class="sw" style="background:#FD3826"><div class="name">Red 01</div><div class="hex">#FD3826</div></div>
  </div>
</body></html>
