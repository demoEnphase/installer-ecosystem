<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:#FAF6EF; font-family: var(--enph-font-primary); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { font-family: var(--enph-font-primary); font-size: 14px; padding: 12px 22px; border-radius: 999px; border: none; cursor: pointer; }
  .primary { background: #3C3C3C; color: #fff; }
  .secondary { background: transparent; color: #3C3C3C; border: 1.5px solid #3C3C3C; }
  .accent { background: #EA6100; color: #fff; }
  .text { background: transparent; color:#3C3C3C; padding: 12px 4px; border-bottom: 1.5px solid #3C3C3C; border-radius: 0; }
</style></head>
<body>
  <button class="btn primary">Learn more</button>
  <button class="btn secondary">Find an installer</button>
  <button class="btn accent">Get Enphase</button>
  <button class="btn text">Watch video →</button>
</body></html>
