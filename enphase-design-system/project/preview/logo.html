<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--enph-font-primary); background: var(--enph-warm-white); display: flex; gap: 16px; align-items: center; min-height: 110px; }
  .swatch { background: #fff; border: 1px solid var(--enph-gray-03); border-radius: 16px; padding: 22px 28px; display: flex; align-items: center; }
  .swatch img { height: 36px; }
  .swatch.dark { background: var(--enph-gray-01); border-color: var(--enph-gray-01); }
  .swatch.gradient { background: linear-gradient(180deg,#FCB571 0%,#F497B3 100%); border: none; }
  .swatch.mark { padding: 18px; }
  .swatch.mark img { height: 48px; }
</style></head>
<body>
  <div class="swatch"><img src="../assets/enphase-logo.svg" alt="Enphase logo"></div>
  <div class="swatch dark"><img src="../assets/enphase-logo-white.svg" alt="Enphase logo white"></div>
  <div class="swatch gradient"><img src="../assets/enphase-logo-white.svg" alt="Enphase logo on gradient"></div>
  <div class="swatch mark"><img src="../assets/enphase-mark.svg" alt="Enphase mark"></div>
</body></html>
