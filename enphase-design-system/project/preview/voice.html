<!doctype html>
<html><head><meta charset="utf-8"><title>Voice & copy</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px 26px; background:#FAF6EF; font-family: var(--enph-font-primary); color:#3C3C3C; }
  .row { display:grid; grid-template-columns: 90px 1fr; gap: 4px 18px; align-items: baseline; margin-bottom: 8px; }
  .l { font-family: var(--enph-font-technical); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color:#7D7D7D; }
  .ex { font-size: 16px; line-height: 1.35; }
  .ex.head { font-size: 22px; letter-spacing: -0.01em; }
  em { color: #EA6100; font-style: normal; }
</style></head>
<body>
  <div class="row"><div class="l">Headline</div><div class="ex head">Take control of your energy.</div></div>
  <div class="row"><div class="l">Tagline</div><div class="ex">Make, use, save, and sell — on your terms.</div></div>
  <div class="row"><div class="l">Triplet</div><div class="ex">Smarter. Tougher. Future-ready.</div></div>
  <div class="row"><div class="l">CTA</div><div class="ex"><em>Learn more →</em></div></div>
  <div class="row"><div class="l">Voice</div><div class="ex">Sentence case. Periods, not exclamation. <em>You</em>, not we. No emoji.</div></div>
</body></html>
