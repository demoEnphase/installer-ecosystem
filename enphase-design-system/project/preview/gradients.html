<!doctype html>
<html><head><meta charset="utf-8"><title>Gradients</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#FAF6EF; font-family:var(--enph-font-primary); }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
  .g { aspect-ratio: 1/1.4; border-radius: 18px; padding: 12px; display:flex; flex-direction: column; justify-content: flex-end; }
  .name { font-family: var(--enph-font-technical); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color:#3C3C3C; background:#fff; padding: 4px 8px; border-radius: 999px; align-self: flex-start; }
</style></head>
<body>
  <div class="row">
    <div class="g" style="background: linear-gradient(180deg, #FCB571 0%, #F497B3 33%, #F7D9A9 66%, #81C6B9 100%)"><span class="name">Brand</span></div>
    <div class="g" style="background: linear-gradient(180deg, #FCB571 0%, #F49787 50%, #C8DEFF 100%)"><span class="name">Sunrise</span></div>
    <div class="g" style="background: linear-gradient(180deg, #FFB6B6 0%, #F49787 50%, #2C436F 100%)"><span class="name">Sunset</span></div>
    <div class="g" style="background: linear-gradient(180deg, #FF8B49 0%, #F7D9A9 100%)"><span class="name">Spot Orange</span></div>
    <div class="g" style="background: linear-gradient(180deg, #7BB9E8 0%, #D6E6FF 100%)"><span class="name">Spot Blue</span></div>
  </div>
</body></html>
