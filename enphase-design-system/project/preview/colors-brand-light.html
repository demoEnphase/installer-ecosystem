<!doctype html>
<html><head><meta charset="utf-8"><title>Light theme brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#FFFFFF; font-family:var(--enph-font-primary); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; }
  .sw { aspect-ratio: 1.1/1; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; }
  .sw .name { font-size: 11px; font-family: var(--enph-font-technical); text-transform: uppercase; letter-spacing: 0.15em; color:#fff; }
  .sw .hex { font-size: 11px; color:#fff; opacity: 0.85; margin-top: 2px; }
  .sw.lt .name, .sw.lt .hex { color:#3C3C3C; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#EA6100"><div class="name">Orange 02</div><div class="hex">#EA6100</div></div>
    <div class="sw" style="background:#F45270"><div class="name">Coral</div><div class="hex">#F45270</div></div>
    <div class="sw" style="background:#439E58"><div class="name">Green 02</div><div class="hex">#439E58</div></div>
    <div class="sw lt" style="background:#FFD02C"><div class="name">Yellow</div><div class="hex">#FFD02C</div></div>
    <div class="sw" style="background:#2C436F"><div class="name">Indigo</div><div class="hex">#2C436F</div></div>
    <div class="sw" style="background:#3B999E"><div class="name">Teal 02</div><div class="hex">#3B999E</div></div>
    <div class="sw" style="background:#DE2100"><div class="name">Red 02</div><div class="hex">#DE2100</div></div>
  </div>
</body></html>
