<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--enph-warm-white); font-family:var(--enph-font-primary); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; }
  .sw { aspect-ratio: 1.1/1; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--enph-gray-03); }
  .sw .name { font-size: 11px; font-family: var(--enph-font-technical); text-transform: uppercase; letter-spacing: 0.15em; }
  .sw .hex { font-size: 11px; color: inherit; opacity: 0.75; margin-top: 2px; }
  .light { color: var(--enph-gray-01); }
  .dark { color: #fff; }
</style></head>
<body>
  <div class="row">
    <div class="sw light" style="background:#FFFFFF"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
    <div class="sw light" style="background:#FAF6EF"><div class="name">Warm White</div><div class="hex">#FAF6EF</div></div>
    <div class="sw light" style="background:#F4F3F0"><div class="name">Gray 04</div><div class="hex">#F4F3F0</div></div>
    <div class="sw light" style="background:#DCDCD6"><div class="name">Gray 03</div><div class="hex">#DCDCD6</div></div>
    <div class="sw dark" style="background:#7D7D7D"><div class="name">Gray 02</div><div class="hex">#7D7D7D</div></div>
    <div class="sw dark" style="background:#3C3C3C"><div class="name">Gray 01</div><div class="hex">#3C3C3C</div></div>
    <div class="sw dark" style="background:#000000"><div class="name">Black</div><div class="hex">#000000</div></div>
  </div>
</body></html>
