<!doctype html>
<html><head><meta charset="utf-8"><title>Photography direction</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:18px; background:#FAF6EF; font-family: var(--enph-font-primary); }
  .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:12px; }
  .a, .b { border-radius: 18px; overflow: hidden; }
  .a img { width: 100%; display: block; }
  .b { background: linear-gradient(180deg, #FCB571 0%, #F497B3 50%, #2C436F 100%); display:flex; align-items:center; justify-content:center; }
  .l { font-family: var(--enph-font-technical); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color:#7D7D7D; margin-top: 6px; }
</style></head>
<body>
  <div class="grid">
    <div><div class="a"><img src="../assets/hero-rooftop.svg" alt=""></div><div class="l">Lifestyle · warm light · everyday</div></div>
    <div><div class="b"><img src="../assets/illustration-sun.svg" alt="" style="width:70%;"/></div><div class="l">Illustration · gradients · sun</div></div>
  </div>
</body></html>
