<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#fff; font-family: var(--enph-font-primary); }
  .row { display:flex; align-items:flex-end; gap:14px; margin-bottom:14px; }
  .sp { background:#EA6100; }
  .l { font-family: var(--enph-font-technical); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color:#7D7D7D; margin-top:6px; text-align:center; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .ra { display:flex; gap:14px; }
  .r { background:#FAF6EF; border:1px solid #DCDCD6; width:70px; height:70px; }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="sp" style="width:4px;height:4px"></div><div class="l">4</div></div>
    <div class="col"><div class="sp" style="width:8px;height:8px"></div><div class="l">8</div></div>
    <div class="col"><div class="sp" style="width:16px;height:16px"></div><div class="l">16</div></div>
    <div class="col"><div class="sp" style="width:24px;height:24px"></div><div class="l">24</div></div>
    <div class="col"><div class="sp" style="width:32px;height:32px"></div><div class="l">32</div></div>
    <div class="col"><div class="sp" style="width:48px;height:48px"></div><div class="l">48</div></div>
    <div class="col"><div class="sp" style="width:64px;height:64px"></div><div class="l">64</div></div>
  </div>
  <div class="ra">
    <div class="col"><div class="r" style="border-radius:8px"></div><div class="l">8</div></div>
    <div class="col"><div class="r" style="border-radius:16px"></div><div class="l">16</div></div>
    <div class="col"><div class="r" style="border-radius:24px"></div><div class="l">24</div></div>
    <div class="col"><div class="r" style="border-radius:48px"></div><div class="l">48</div></div>
    <div class="col"><div class="r" style="border-radius:9999px"></div><div class="l">Pill</div></div>
  </div>
</body></html>
