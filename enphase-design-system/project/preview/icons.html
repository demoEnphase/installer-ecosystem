<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; padding:22px; background:#fff; font-family: var(--enph-font-primary); }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 14px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:6px; color:#3C3C3C; }
  .ic svg { stroke-width: 1.5; }
  .l { font-family: var(--enph-font-technical); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color:#7D7D7D; }
</style></head>
<body>
  <div class="grid">
    <div class="ic"><i data-lucide="sun"></i><div class="l">Sun</div></div>
    <div class="ic"><i data-lucide="zap"></i><div class="l">Power</div></div>
    <div class="ic"><i data-lucide="battery-charging"></i><div class="l">Battery</div></div>
    <div class="ic"><i data-lucide="house"></i><div class="l">Home</div></div>
    <div class="ic"><i data-lucide="plug-zap"></i><div class="l">Charger</div></div>
    <div class="ic"><i data-lucide="bar-chart-3"></i><div class="l">Energy</div></div>
    <div class="ic"><i data-lucide="settings"></i><div class="l">Settings</div></div>
    <div class="ic"><i data-lucide="bell"></i><div class="l">Alerts</div></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
