<!doctype html>
<html><head><meta charset="utf-8"><title>Product imagery</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>

  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
  img { width: 100%; border-radius: 18px; display: block; }
  .l { font-family: var(--enph-font-technical); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color:#7D7D7D; margin-top: 6px; text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div><img src="../assets/product-iq8.svg" alt=""><div class="l">IQ8 Microinverter</div></div>
    <div><img src="../assets/product-battery.svg" alt=""><div class="l">IQ Battery 10C</div></div>
    <div><img src="../assets/product-ev-charger.svg" alt=""><div class="l">IQ EV Charger 2</div></div>
  </div>
</body></html>
