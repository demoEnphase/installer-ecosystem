[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[theme]
primaryColor             = "#EA6100"
backgroundColor          = "#FAF6EF"
secondaryBackgroundColor = "#F4F3F0"
textColor                = "#3C3C3C"
font                     = "sans serif"
